services:
  db:
    image: postgres:16-alpine
    container_name: psql-evql-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata-evql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  redis:
    image: redis:7-alpine
    container_name: redis-evql
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: evql-api
    restart: always
    depends_on:
     db:
       condition: service_healthy
     redis:
       condition: service_healthy
    ports:
     - "3000:3000"
    volumes:
     - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env

volumes:
  pgdata-evql: